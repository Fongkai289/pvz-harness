name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --locked --python 3.11 --group dev
      - name: Offline tests (no game resources, secrets or model calls)
        run: uv run --locked pytest -q -ra --junitxml=test-results.xml
      - name: Reproduce the Portable source patch
        run: |
          git clone https://github.com/wszqkzqk/PvZ-Portable.git "$RUNNER_TEMP/portable"
          git -C "$RUNNER_TEMP/portable" checkout 98b659380014c89c3553fbb2839f5e5a84d6df3d
          uv run --locked python scripts/apply_portable_patch.py "$RUNNER_TEMP/portable"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: test-results.xml
